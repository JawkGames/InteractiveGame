<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffe3cf">
<title>Interactive Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffe3cf; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #oyun { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #video { position: fixed; left: 10px; bottom: 10px; width: 92px; border-radius: 12px; transform: scaleX(-1);
    opacity: .9; border: 2px solid #fff; display: none; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .rozet { padding: 6px 14px; border-radius: 999px; background: rgba(60,36,90,.55); color: #fff;
    font-weight: 900; font-size: 22px; letter-spacing: .3px; line-height: 1.2; }
  #skor { position: fixed; left: 12px; top: 10px; pointer-events: none; }
  #sag { position: fixed; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 30; }
  #elmas { pointer-events: none; }
  #tamEkran, #ev, #ayar { width: 46px; height: 46px; font-size: 24px; line-height: 1; color: #fff; background: rgba(60,36,90,.55);
    border: 2px solid rgba(255,255,255,.9); border-radius: 14px; padding: 0; display: none; }
  #durum { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); max-width: 86vw; padding: 8px 18px;
    border-radius: 999px; background: rgba(60,36,90,.6); color: #fff; font-weight: 800; font-size: 18px;
    text-align: center; pointer-events: none; display: none; }
  #panel { position: fixed; left: 4vw; top: 50%; transform: translateY(-50%); width: min(42vw, 360px);
    max-height: 92vh; overflow: auto; box-sizing: border-box; padding: 20px 22px; border-radius: 26px; text-align: center;
    background: rgba(255,255,255,.93); color: #4a2a6b; box-shadow: 0 10px 0 rgba(74,42,107,.14); z-index: 10; }
  #panel h1 { margin: 0 0 6px; font-size: 28px; color: #ff4f9a; line-height: 1.1; }
  #panel p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
  #panel .buyuk { font-size: 40px; font-weight: 900; color: #ff8a00; margin: 0; line-height: 1.1; }
  #panel .ipucu { font-size: 13px; opacity: .75; }
  #panel .surum { font-size: 11px; opacity: .45; margin-top: 8px; }
  .secim { display: flex; gap: 10px; margin: 12px 0 4px; }
  .kart { flex: 1; padding: 12px 6px; font-size: 17px; font-weight: 800; color: #4a2a6b; background: #f3ecff;
    border: 3px solid transparent; border-radius: 16px; }
  .kart.secili { border-color: #ff4f9a; background: #ffe6f1; }
  .ana { margin-top: 12px; padding: 14px 38px; font-size: 21px; font-weight: 900; color: #fff; background: #ff4f9a;

  .ikinci { margin-top: 12px; margin-left: 6px; padding: 12px 16px; font-size: 15px; font-weight: 800; color: #4a2a6b;

<div class="rozet" id="skor">0</div>
<div id="sag"><div class="rozet" id="elmas">💎 0</div><button id="tamEkran" aria-label="Tam ekran">⛶</button><button id="ev" aria-label="Oyunlar">🏠</button><button id="ayar" aria-label="Hassasiyet">⚙️</button></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js";
import oyunlariKur from "./oyunlar.js";

// =====================================================================================================
//  AYARLAR
// =====================================================================================================
const SURUM = "3.1";
const POZ_KUTUPHANE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs";
const POZ_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm";
const POZ_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

const SERIT_X = [-2, 0, 2];
const HIZ_BAS = 9, HIZ_MAX = 22;            // birim/sn
const ZORLUK_SURE = 600;                    // sn: en zor hâle 10 dakikada ulaşır
const ARALIK_BAS = 3.2, ARALIK_SON = 1.7;   // engeller arası süre (sn)
const DOGMA_Z = -96;
const ZIPLA_TEPE = 2.6;                     // zıplama yüksekliği (birim)
const ZIPLA_SURE = 0.85;                    // normal havada kalma (sn)
const ZIPLA_YARDIM_SN = 1.0;                // zıplayınca bu kadar sn ilerideki alçak engel geçilmiş sayılır
const EGIL_YARDIM_SN = 1.0;                 // eğilince bu kadar sn ilerideki kiriş geçilene dek eğik kalır
const TOLERANS_KAMERA = 0.16, TOLERANS_TUS = 0.07;  // çarpma anında tanınan son şans süresi (sn)
const ZIPLA_ESIK = 0.12;                    // gövde boyunun bu kadarı yükselince zıplama
const EGIL_ESIK = 0.30;                     // gövde boyunun bu kadarı alçalınca eğilme
const SERIT_ESIK = 0.45;                    // omuz genişliğinin bu kadarı yana kayınca şerit değişir
const OLCUM_KARE = 16;
const KALCA_Y = 0.84;

const $ = id => document.getElementById(id);
const rast = n => Math.floor(Math.random() * n);
const sinirla = (v, a, b) => Math.min(b, Math.max(a, v));
const yaklas = (a, b, k) => a + (b - a) * k;
const dokunmatik = matchMedia("(pointer: coarse)").matches;

// =====================================================================================================
//  SES (WebAudio: gecikmesiz, çizimi yormaz)
// =====================================================================================================
const SES_YOL = {
  elmas: "assets/ses/elmaslar/elmas.mp3", zipla: "assets/ses/popeye/sekme1.mp3",
  carp: "assets/ses/popeye/bastonVur.mp3", vur: "assets/ses/popeye/ayakVur.mp3",
  kaybet: "assets/ses/popeye/tamKaybet.mp3",
  adim1: "assets/ses/popeye/adim1.mp3", adim2: "assets/ses/popeye/adim2.mp3", adim3: "assets/ses/popeye/adim3.mp3",
  blok: "assets/ses/cevre/tahtaVur.mp3", kir: "assets/ses/cevre/tasKir.mp3"
};
let sesCtx = null, sesAna = null;
const sesTampon = {};
function sesleriYukle() {
  if (sesCtx) { sesCtx.resume && sesCtx.resume(); return; }
  try {
    sesCtx = new (window.AudioContext || window.webkitAudioContext)();
    sesAna = sesCtx.createGain(); sesAna.gain.value = 0.9; sesAna.connect(sesCtx.destination);
    for (const ad in SES_YOL) {
      fetch(SES_YOL[ad]).then(r => r.arrayBuffer())
        .then(b => new Promise((tamam, hata) => sesCtx.decodeAudioData(b, tamam, hata)))
        .then(t => { sesTampon[ad] = t; }).catch(() => {});
    }
  } catch (e) { sesCtx = null; }
}
function cal(ad, siddet = 1, perde = 1) {
  const t = sesTampon[ad];
  if (!t || !sesCtx) return;
  try {
    const k = sesCtx.createBufferSource(); k.buffer = t; k.playbackRate.value = perde;
    const g = sesCtx.createGain(); g.gain.value = siddet;
    k.connect(g); g.connect(sesAna); k.start();
  } catch (e) {}
}

// =====================================================================================================
//  ÇİZİCİ, SAHNE, IŞIK
// =====================================================================================================
const tuval = $("oyun");
const cizer = new THREE.WebGLRenderer({ canvas: tuval, antialias: true, powerPreference: "high-performance", stencil: false });
cizer.toneMapping = THREE.ACESFilmicToneMapping;
cizer.toneMappingExposure = 1.06;
cizer.shadowMap.enabled = true;
cizer.shadowMap.type = THREE.PCFSoftShadowMap;
const sahne = new THREE.Scene();
const SIS_RENK = 0xd9eeff;          // ufuk rengi: uzak zemin bu açık maviye karışır
sahne.fog = new THREE.Fog(SIS_RENK, 50, 98);
const kamera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);

// Tohumlu rastgele (dokular her açılışta aynı çıksın)
let tohum = 7;
const tr = () => { tohum = (tohum * 16807) % 2147483647; return (tohum - 1) / 2147483646; };

function dokuYap(w, h, ciz, tx = 1, ty = 1) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  ciz(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(tx, ty);
  t.anisotropy = Math.min(4, cizer.capabilities.getMaxAnisotropy());
  return t;
}

// Gökyüzü: parlak mavi geçiş. Bulutlar, tepeler ve güneş aşağıda ayrıca çizilir (hepsi kodla, dosya yok).
const arkaDoku = dokuYap(16, 512, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#0a6cff"); g.addColorStop(0.3, "#2c90ff"); g.addColorStop(0.43, "#6fb8ff"); g.addColorStop(0.5, "#d9eeff"); g.addColorStop(1, "#d9eeff");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
arkaDoku.wrapT = THREE.ClampToEdgeWrapping;
const arka = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), new THREE.MeshBasicMaterial({ map: arkaDoku, side: THREE.BackSide, fog: false, depthWrite: false }));
arka.renderOrder = -1;
sahne.add(arka);

// Ortam yansıması (plastik parlaklığı buradan gelir): mavi gök + parlak güneş
{
  const os = new THREE.Scene();
  const kg = new THREE.SphereGeometry(50, 16, 8);
  const renk = new Float32Array(kg.attributes.position.count * 3), ust = new THREE.Color(0x9fd0ff), alt = new THREE.Color(0xf2dcc0), c = new THREE.Color();
  for (let i = 0; i < kg.attributes.position.count; i++) {
    c.copy(alt).lerp(ust, sinirla(kg.attributes.position.getY(i) / 50 * 0.5 + 0.5, 0, 1));
    renk[i * 3] = c.r; renk[i * 3 + 1] = c.g; renk[i * 3 + 2] = c.b;
  }
  kg.setAttribute("color", new THREE.BufferAttribute(renk, 3));
  os.add(new THREE.Mesh(kg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const gunesPanel = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshBasicMaterial({ color: new THREE.Color(11, 10.2, 8.6), side: THREE.DoubleSide }));
  gunesPanel.position.set(22, 26, 14); gunesPanel.lookAt(0, 0, 0); os.add(gunesPanel);
  const dolgu = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3.5, 4.2), side: THREE.DoubleSide }));
  dolgu.position.set(-24, 14, -10); dolgu.lookAt(0, 0, 0); os.add(dolgu);
  const pm = new THREE.PMREMGenerator(cizer);
  sahne.environment = pm.fromScene(os, 0.03).texture;
  pm.dispose(); kg.dispose();
}

sahne.add(new THREE.HemisphereLight(0xd6ecff, 0xc9a77c, 0.6));
const gunes = new THREE.DirectionalLight(0xfff3d6, 2.75);
gunes.position.set(14, 26, -2); gunes.target.position.set(0, 0, -14);
gunes.castShadow = true;
gunes.shadow.mapSize.set(1024, 1024);
Object.assign(gunes.shadow.camera, { left: -16, right: 16, top: 25, bottom: -25, near: 2, far: 70 });
gunes.shadow.camera.updateProjectionMatrix();
gunes.shadow.bias = -0.0006; gunes.shadow.normalBias = 0.04;
sahne.add(gunes, gunes.target);

// Malzemeler: tek "plastik" ve tek "kumaş" malzeme, renkler köşe rengiyle gelir (az çizim çağrısı)
const mPlastik = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.36, metalness: 0, envMapIntensity: 0.75 });
const mKumas = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0, envMapIntensity: 0.4 });
const mMetal = new THREE.MeshStandardMaterial({ color: 0xffc94a, roughness: 0.25, metalness: 1, envMapIntensity: 1.3 });
const mElmas = new THREE.MeshStandardMaterial({ color: 0x0a9cff, roughness: 0.18, metalness: 0.2, flatShading: true,
  emissive: 0x0a6fe0, emissiveIntensity: 1.1, envMapIntensity: 0.8 });

// =====================================================================================================
//  ŞEKİL YARDIMCILARI: parçaları tek geometride birleştirir (her oyuncak = 1 çizim çağrısı)
// =====================================================================================================
const _mat = new THREE.Matrix4(), _poz = new THREE.Vector3(), _kuat = new THREE.Quaternion(), _olc = new THREE.Vector3(1, 1, 1);
const _eul = new THREE.Euler(), _renk = new THREE.Color(), PI = Math.PI;
const gc = {};
const kure = (seg = 14) => gc["k" + seg] || (gc["k" + seg] = new THREE.SphereGeometry(1, seg, Math.max(6, Math.round(seg * 0.7))));
const sil = (seg = 14) => gc["s" + seg] || (gc["s" + seg] = new THREE.CylinderGeometry(1, 1, 1, seg));
const koni = (seg = 14) => gc["n" + seg] || (gc["n" + seg] = new THREE.ConeGeometry(1, 1, seg));
const kapsul = (r, boy) => new THREE.CapsuleGeometry(r, boy, 5, 12);
const simit = (r, kalinlik, yay = PI * 2, seg = 22) => new THREE.TorusGeometry(r, kalinlik, 8, seg, yay);
function yKutu(w, h, d, r = 0.06) {           // kenarları yumuşatılmış kutu
  const b = Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002);
  const iw = w - 2 * b, ih = h - 2 * b, cr = Math.min(b, iw / 2, ih / 2), s = new THREE.Shape();
  s.moveTo(-iw / 2 + cr, -ih / 2); s.lineTo(iw / 2 - cr, -ih / 2); s.quadraticCurveTo(iw / 2, -ih / 2, iw / 2, -ih / 2 + cr);
  s.lineTo(iw / 2, ih / 2 - cr); s.quadraticCurveTo(iw / 2, ih / 2, iw / 2 - cr, ih / 2);
  s.lineTo(-iw / 2 + cr, ih / 2); s.quadraticCurveTo(-iw / 2, ih / 2, -iw / 2, ih / 2 - cr);
  s.lineTo(-iw / 2, -ih / 2 + cr); s.quadraticCurveTo(-iw / 2, -ih / 2, -iw / 2 + cr, -ih / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 3, steps: 1 });
  g.translate(0, 0, -(d - 2 * b) / 2);
  return g;
}
// p: parça tanımı (geometri, renk, konum, dönüş, ölçek)
function p(geo, renk, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy, sz) {
  return { geo, renk, x, y, z, rx, ry, rz, sx, sy: sy === undefined ? sx : sy, sz: sz === undefined ? sx : sz };
}
function birlestir(parcalar) {
  let toplam = 0; const hazir = [];
  for (const q of parcalar) {
    const g = q.geo.index ? q.geo.toNonIndexed() : q.geo.clone();
    _mat.compose(_poz.set(q.x, q.y, q.z), _kuat.setFromEuler(_eul.set(q.rx, q.ry, q.rz)), _olc.set(q.sx, q.sy, q.sz));
    g.applyMatrix4(_mat); hazir.push(g); toplam += g.attributes.position.count;
  }
  const P = new Float32Array(toplam * 3), N = new Float32Array(toplam * 3), C = new Float32Array(toplam * 3);
  let o = 0;
  hazir.forEach((g, i) => {
    const n = g.attributes.position.count;
    P.set(g.attributes.position.array.subarray(0, n * 3), o * 3);
    N.set(g.attributes.normal.array.subarray(0, n * 3), o * 3);
    _renk.set(parcalar[i].renk);
    for (let k = 0; k < n; k++) { C[(o + k) * 3] = _renk.r; C[(o + k) * 3 + 1] = _renk.g; C[(o + k) * 3 + 2] = _renk.b; }
    o += n; g.dispose();
  });
  const cikti = new THREE.BufferGeometry();
  cikti.setAttribute("position", new THREE.BufferAttribute(P, 3));
  cikti.setAttribute("normal", new THREE.BufferAttribute(N, 3));
  cikti.setAttribute("color", new THREE.BufferAttribute(C, 3));
  cikti.computeBoundingSphere();
  return cikti;
}

const R = { kirmizi: 0xff4756, turuncu: 0xff8a2a, sari: 0xffd23f, yesil: 0x46d16a, turkuaz: 0x2ec4b6, mavi: 0x3a86ff,
  mor: 0x8f5bff, pembe: 0xff5fa2, beyaz: 0xfbfbfb, krem: 0xfff0d2, ahsap: 0xdba463, koyuAhsap: 0xa06a3c, gri: 0xb9c2cf, siyah: 0x2a2233 };
const CANLI = [R.kirmizi, R.turuncu, R.sari, R.yesil, R.turkuaz, R.mavi, R.mor, R.pembe];

// --- Oyuncak parçaları ---
function kupEkle(liste, boyut, y, renk, panel, ry = 0, x = 0, z = 0) {
  liste.push(p(yKutu(boyut, boyut, boyut, boyut * 0.07), renk, x, y + boyut / 2, z, 0, ry, 0));
  const s = boyut * 0.62, d = boyut / 2 + 0.004;
  for (let i = 0; i < 4; i++) {
    const a = ry + i * PI / 2;
    liste.push(p(yKutu(s, s, 0.05, 0.02), panel, x + Math.sin(a) * d, y + boyut / 2, z + Math.cos(a) * d, 0, a, 0));
  }
  liste.push(p(yKutu(s, 0.05, s, 0.02), panel, x, y + boyut + 0.004, z, 0, ry, 0));
}
function kupKulesiGeo(boyutlar, renkler) {
  const l = []; let y = 0;
  boyutlar.forEach((b, i) => { kupEkle(l, b, y, renkler[i], R.krem, (i % 2 ? 0.35 : -0.2) * i); y += b; });
  return birlestir(l);
}
function halkaKulesiGeo() {
  const l = [p(sil(20), R.ahsap, 0, 0.09, 0, 0, 0, 0, 0.85, 0.18, 0.85), p(sil(10), R.ahsap, 0, 1.75, 0, 0, 0, 0, 0.09, 3.3, 0.09)];
  const renkler = [R.mor, R.mavi, R.yesil, R.sari, R.turuncu, R.kirmizi]; let y = 0.18;
  for (let i = 0; i < 6; i++) {
    const k = 0.25 - i * 0.02, r = 0.56 - i * 0.065;
    l.push(p(simit(r, k, PI * 2, 26), renkler[i], 0, y + k, 0, PI / 2, 0, 0)); y += k * 2 - 0.02;
  }
  l.push(p(kure(14), R.kirmizi, 0, 3.5, 0, 0, 0, 0, 0.22));
  return birlestir(l);
}
function roketGeo() {

name: Android Derle

on:
  push:
    branches: [mobil]   # Android sadece "mobil" dalına gönderilince derlenir
    tags: ["mobil-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: derle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm ci

      - name: Hareket modelini indir (uygulamaya gömülür, internetsiz çalışır)
        run: |
          mkdir -p model
          curl -fL --retry 3 -o model/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          ls -la model

      - name: Android projesini oluştur
        run: |
          node scripts/hazirla.js www
          node scripts/hazirla.js config
          npx cap add android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            export KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          fi
          node scripts/hazirla.js android
          npx cap sync android

      - name: Test APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Yayın AAB derle (anahtar varsa imzalı, yoksa imzasız — sonra elle imzalanır)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Dosyaları hazırla
        run: |
          mkdir -p cikti
          cp android/app/build/outputs/apk/debug/app-debug.apk cikti/oyun-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab cikti/oyun-yayin.aab
          fi

      - name: Son sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son --yes --cleanup-tag || true
          gh release create son cikti/* --title "Son sürüm (#${{ github.run_number }})" --notes "Otomatik derleme #${{ github.run_number }}" --latest
